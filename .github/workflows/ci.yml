name: CI

# Phase 1 / G-07：PR 与 push 必过门禁（后端 ruff + 确定性单测；前端 typecheck + build）
# 说明：本仓库同时在 Gitee 备份，Gitee 侧如需同等门禁请配置对应的 Go 流水线。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: 静态检查（ruff）
        run: python -m ruff check .
      - name: 单元测试（确定性子集，跳过 integration）
        # integration 标记的用例依赖生产库/外部服务或与实时数据强相关，随数据漂移，
        # 不纳入 CI 门禁；本地用 `pytest -m integration` 手工跑。
        run: python -m pytest -m "not integration" --no-header

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 类型检查（tsc --noEmit）
        run: npm run typecheck
      - name: 构建（next build）
        run: npm run build
